name: Ghidra analyze

on:
  workflow_dispatch:
    inputs:
      reanalyze:
        description: "วิเคราะห์ใหม่ทั้งหมด (ไม่ใช้ cache)"
        type: boolean
        default: false
      only:
        description: "วิเคราะห์เฉพาะไลบรารีเหล่านี้ (คั่นด้วย , ว่าง = ทุกตัวใน zip)"
        type: string
        default: "libGTASA.so,libCheatMenu64.so"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unzip input
        run: |
          mkdir -p work
          unzip -o input/*.zip -d work
          find work -type f -exec ls -la {} +

      - name: Download Ghidra (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g
          gh release download --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp/g
          unzip -q /tmp/g/*.zip -d /opt
          echo "GHIDRA=$(ls -d /opt/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - name: Restore Ghidra project cache
        id: cache
        if: ${{ !inputs.reanalyze }}
        uses: actions/cache@v4
        with:
          path: gproj
          key: gproj-${{ hashFiles('input/*.zip') }}

      - name: Run Ghidra headless (ทุก .so ใน zip)
        env:
          MAXMEM: 5G
          KEYWORDS_FILE: ${{ github.workspace }}/kw_run.txt
          MAX_DECOMP: "4000"
          MAX_CALLERS: "150"
          ONLY: ${{ inputs.only }}
        run: |
          mkdir -p out gproj
          START=$(date +%s)
          BUDGET=$((320*60))

          # ถ้ามีโฟลเดอร์ arm64-v8a ใช้เฉพาะโฟลเดอร์นั้น (กันซ้ำหลาย ABI)
          LIBDIR=$(find work -type d -name arm64-v8a | head -n1)
          if [ -n "$LIBDIR" ]; then SEARCH="$LIBDIR"; else SEARCH=work; fi

          # ใหญ่ -> เล็ก, ตัดไฟล์เล็กกว่า 50KB, ตัดไลบรารีระบบ, ตัดชื่อซ้ำ
          find "$SEARCH" -type f -name '*.so' -size +50k -printf '%s %p\n' | sort -rn | cut -d' ' -f2- \
            | grep -v -E '/(libc\+\+_shared|libc|libm|libdl|liblog|libandroid|libz|libEGL|libGLESv[0-9]+|libOpenSLES|libjnigraphics)\.so$' \
            | awk -F/ '!seen[$NF]++' > libs.txt || true
          if [ -n "$ONLY" ]; then
            PAT=$(echo "$ONLY" | tr ',' '\n' | sed 's/^ *//; s/ *$//; s/\./\\./g' | grep -v '^$' | paste -sd'|')
            if [ -n "$PAT" ]; then
              grep -E "/($PAT)$" libs.txt > libs.only || true
              if [ -s libs.only ]; then mv libs.only libs.txt; else echo ">> ไม่พบไลบรารีตาม only=$ONLY ใช้ทุกตัวแทน"; fi
            fi
          fi
          if [ ! -s libs.txt ]; then echo "ไม่พบไฟล์ .so ใน input/*.zip"; exit 1; fi
          # libCheatMenu64 ก่อน -> ได้ offset ฝั่งเกมที่เมนู (รวมหน้าที่กู้ได้) อ้างถึง แล้วค่อยถอด libGTASA ต่อในรอบเดียว
          { grep -i 'cheatmenu' libs.txt || true; grep -vi 'cheatmenu' libs.txt || true; } > libs.ord && mv libs.ord libs.txt
          cp keywords.txt kw_run.txt
          echo ">> จะวิเคราะห์:"; cat libs.txt
          cp libs.txt out/libs.txt

          while IFS= read -r SO; do
            NAME=$(basename "$SO")
            OUT="$PWD/out/${NAME%.so}"
            REMAIN=$((BUDGET - ($(date +%s) - START)))
            if [ "$REMAIN" -lt 900 ]; then
              echo ">> ข้าม $NAME (เวลาไม่พอ)" | tee -a out/index.txt
              continue
            fi
            TMO=$((REMAIN - 600))
            if [ "$TMO" -gt 17000 ]; then TMO=17000; fi
            echo ">> $NAME  (analysis timeout ${TMO}s)"
            if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
              echo ">> ใช้ project จาก cache (ข้ามการวิเคราะห์)"
              OUT_DIR="$OUT" "$GHIDRA/support/analyzeHeadless" gproj p -process "$NAME" -noanalysis \
                -scriptPath "$PWD/scripts" -postScript DefineCode.java -postScript ExportInfo.java < /dev/null
            else
              echo ">> import + วิเคราะห์ใหม่ (ช้า)"
              OUT_DIR="$OUT" "$GHIDRA/support/analyzeHeadless" gproj p -import "$SO" -overwrite \
                -analysisTimeoutPerFile "$TMO" \
                -scriptPath "$PWD/scripts" -postScript DefineCode.java -postScript ExportInfo.java < /dev/null
            fi
            # ---- ข้อมูลดิบที่ Ghidra export ไม่ให้ (ไบต์ rodata/data, ตารางพอยน์เตอร์, ช่อง GOT) ----
            case "$NAME" in
              *CheatMenu*)
                python3 scripts/elfdump.py "$SO" "$OUT" --mode menu || true
                python3 scripts/gen_game_offsets.py "$OUT/decompiled.c" gen_kw.txt "$OUT/menu_game_offsets.txt" || true
                if [ -s gen_kw.txt ]; then { echo; echo "@lib libgtasa"; cat gen_kw.txt; } >> kw_run.txt; fi
                ;;
              *libGTASA*)
                python3 scripts/elfdump.py "$SO" "$OUT" --mode game --offsets out/libCheatMenu64/menu_game_offsets.txt --window 0x20000 || true
                ;;
            esac
            echo "== $NAME ==" >> out/index.txt
            cat "$OUT/summary.txt" >> out/index.txt 2>/dev/null || echo "(ไม่มี summary)" >> out/index.txt
          done < libs.txt
          cat out/index.txt || true

      - name: Post-process (ใส่ชื่อสัญลักษณ์เกมแทน FUN_/DAT_ + byfunc.tsv)
        if: always()
        run: python3 scripts/postprocess.py out || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-out
          path: out/
